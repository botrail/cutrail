[package]
name = "cutrail"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Material removal simulation core for machining: mesh-based stock, robust booleans, 3- and 5-axis sweeps, STEP/mesh I/O"
readme = "README.md"
repository = "https://github.com/botrail/cutrail"
documentation = "https://docs.rs/cutrail"
keywords = ["cnc", "machining", "simulation", "cam", "mesh"]
categories = ["simulation", "science"]
exclude = [".github/", ".internal/"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["cutrail-wasm"]
exclude = [".internal"]

[dependencies]
manifold-rust = "0.16"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
# SolidCore's STEP and tessellation crates are not published yet. Keep every layer
# on the same reviewed snapshot rather than following its moving main branch.
solidcore = { git = "https://github.com/tangency-labs/solidcore", rev = "10ea8361a46eed8f42c32c32c6a006a0a7adb4a8", optional = true }
solidcore-convert = { git = "https://github.com/tangency-labs/solidcore", rev = "10ea8361a46eed8f42c32c32c6a006a0a7adb4a8", optional = true }
solidcore-step = { git = "https://github.com/tangency-labs/solidcore", rev = "10ea8361a46eed8f42c32c32c6a006a0a7adb4a8", optional = true }
solidcore-tess = { git = "https://github.com/tangency-labs/solidcore", rev = "10ea8361a46eed8f42c32c32c6a006a0a7adb4a8", optional = true }
solidcore-record = { git = "https://github.com/tangency-labs/solidcore", rev = "10ea8361a46eed8f42c32c32c6a006a0a7adb4a8", optional = true }
solidcore-ops = { git = "https://github.com/tangency-labs/solidcore", rev = "10ea8361a46eed8f42c32c32c6a006a0a7adb4a8", optional = true }
web-time = "1"
zip = { version = "7.3.0", default-features = false }

[features]
default = []
# Parallel booleans in manifold-rust. Native only; WebAssembly stays single-threaded.
parallel = ["manifold-rust/parallel"]
# Serialize / Deserialize for poses, segments, tools, options, reports, meshes and B-reps.
serde = ["dep:serde"]
# Reading and retaining STEP CAD models, then tessellating stock and design meshes.
stepio = ["dep:solidcore", "dep:solidcore-convert", "dep:solidcore-step", "dep:solidcore-tess", "dep:solidcore-record", "dep:solidcore-ops"]

[dev-dependencies]
serde_json = "1"
